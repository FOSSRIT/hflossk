[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hflossk"
version = "0.6.0"
description = "HFOSS course materials via Flask"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.14"
authors = [
    { name = "Remy DeCausemaker", email = "decause@gmail.com" },
    { name = "Justin Wheeler", email = "foss@jwheel.org" },
]
classifiers = [
    "Intended Audience :: Education",
    "Topic :: Education :: Computer Aided Instruction (CAI)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "Flask>=3.0",
    "feedparser>=6.0",
    "PyYAML>=6.0",
    "Frozen-Flask>=1.0",
    "gunicorn>=22.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "validator.py>=1.3",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://fossrit.github.io/hflossk"
Repository = "https://github.com/FOSSRIT/hflossk"

[tool.setuptools.packages.find]
include = ["hflossk*"]

[tool.setuptools.package-data]
hflossk = [
    "templates/**/*.html",
    "static/**/*",
    "*.yaml",
]

[tool.ruff]
target-version = "py314"
line-length = 120
exclude = ["scripts/", "hflossk/static/ipynb/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["hflossk/tests"]
